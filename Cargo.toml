[package]
name = "dcr"
version = "0.1.0"
edition = "2021"
description = "DICOM TUI Viewer"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-widget-ref"] }
crossterm = "0.28"
dicom-core = "0.8"
dicom-object = "0.8"
dicom-parser = "0.8"
dicom-encoding = "0.8"
dicom-dictionary-std = "0.8"
dicom-transfer-syntax-registry = { version = "0.8", default-features = false, features = ["native"] }
dicom-pixeldata = { version = "0.8", default-features = false, features = ["image", "native"] }
image = { version = "0.25", default-features = false }
ratatui-image = { version = "3.0.0", default-features = false }
clap = "4.5"
ratatui-explorer = "0.2"
