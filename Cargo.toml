[package]
name = "dcr"
version = "0.1.0"
edition = "2021"
description = "DICOM TUI Viewer"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-widget-ref"] }
crossterm = "0.29"
dicom-core = "0.10"
dicom-object = "0.10"
dicom-parser = "0.10"
dicom-encoding = "0.10"
dicom-dictionary-std = "0.10"
dicom-transfer-syntax-registry = { version = "0.10", default-features = false, features = ["native"] }
dicom-pixeldata = { version = "0.10", default-features = false, features = ["image", "native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui-image = { version = "11.0", default-features = false }
clap = "4.5"
ratatui-explorer = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
